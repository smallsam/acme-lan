name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Set up Go (for Pebble e2e)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Pebble + challtestsrv
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --extra dev --extra storage

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (for the seeded test server)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the dashboard
        working-directory: src/acme_lan/web
        run: |
          npm ci
          npm run build

      - name: Install Playwright (Chromium)
        working-directory: src/acme_lan/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI tests
        working-directory: src/acme_lan/web
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/acme_lan/web/playwright-report
          retention-days: 7
