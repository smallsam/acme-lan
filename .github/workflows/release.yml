name: Release to Docker Hub

# Publishes a multi-arch image to Docker Hub on every semver tag (v1.2.3) and on
# manual dispatch. Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# The image name defaults to <DOCKERHUB_USERNAME>/acme-lan; override with the
# DOCKERHUB_IMAGE repository variable.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          NAME="${{ vars.DOCKERHUB_IMAGE }}"
          if [ -z "$NAME" ]; then NAME="${{ secrets.DOCKERHUB_USERNAME }}/acme-lan"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
