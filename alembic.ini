# Alembic config for manual use in dev (the app runs migrations programmatically via
# acme_lan.migrate.run_migrations, which sets script_location and the URL itself).
#
#   uv run alembic revision --autogenerate -m "add X"   # create a new migration
#   uv run alembic upgrade head                          # apply migrations
#
# Set the URL to your sync driver, e.g. sqlite:///./data/acme_lan.db
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./data/acme_lan.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
